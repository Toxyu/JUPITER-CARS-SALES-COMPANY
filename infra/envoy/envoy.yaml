static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                use_remote_address: true
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: jupiter
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:8081
                          - exact: http://localhost:5173
                        allow_methods: GET, POST, OPTIONS
                        allow_headers: authorization,content-type,idempotency-key
                        expose_headers: x-cache
                        max_age: "3600"
                      routes:
                        - match: { prefix: /api/v1/vehicles/ }
                          route: { cluster: inventory, timeout: 10s }
                        - match: { prefix: /api/v1/rentals/ }
                          route: { cluster: rentals, timeout: 15s }
                        - match: { prefix: /api/v1/admin/ }
                          route: { cluster: sales, timeout: 15s }
                        - match: { prefix: /api/v1/sales/ }
                          route: { cluster: sales, timeout: 15s }
                        - match: { path: /health }
                          route: { cluster: inventory, timeout: 3s }
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      bypass_cors_preflight: true
                      providers:
                        jupiter:
                          issuer: http://localhost:8082/realms/jupiter
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/jupiter/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 600s
                          forward_payload_header: x-jwt-payload
                      rules:
                        - match: { prefix: /api/v1/rentals/reserve }
                          requires: { provider_name: jupiter }
                        - match: { prefix: /api/v1/sales/checkout }
                          requires: { provider_name: jupiter }
                        - match: { prefix: /api/v1/admin/ }
                          requires: { provider_name: jupiter }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: inventory
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: inventory
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: inventory, port_value: 8080 } } } }] }]
    - name: rentals
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: rentals
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: rentals, port_value: 3001 } } } }] }]
    - name: sales
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: sales
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: sales, port_value: 8000 } } } }] }]
    - name: keycloak
      type: STRICT_DNS
      connect_timeout: 3s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: keycloak
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: keycloak, port_value: 8080 } } } }] }]
admin:
  access_log_path: /dev/null
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }