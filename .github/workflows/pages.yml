name: Deploy Jupiter Cars to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.JUPITER_PUBLIC_API_URL }}
          VITE_KEYCLOAK_URL: ${{ vars.JUPITER_PUBLIC_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: jupiter
          VITE_KEYCLOAK_CLIENT_ID: jupiter-web
        run: |
          if [[ -n "$VITE_API_BASE_URL" && -n "$VITE_KEYCLOAK_URL" ]]; then
            export VITE_DEMO_MODE=false
          else
            export VITE_DEMO_MODE=true
            echo 'Deploying browse-only preview. Set JUPITER_PUBLIC_API_URL and JUPITER_PUBLIC_KEYCLOAK_URL to enable live services.'
          fi
          npm ci
          npm run build
      - name: Publish static site to the configured Pages root
        run: |
          cp web/dist/index.html index.html
          mkdir -p assets
          cp web/dist/assets/* assets/
          touch .nojekyll
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo 'Pages output is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sync Pages showroom [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"