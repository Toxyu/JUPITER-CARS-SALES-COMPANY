name: Deploy Jupiter Cars to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        env:
          GITHUB_ACTIONS: 'true'
          VITE_API_BASE_URL: ${{ vars.JUPITER_PUBLIC_API_URL }}
          VITE_KEYCLOAK_URL: ${{ vars.JUPITER_PUBLIC_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: jupiter
          VITE_KEYCLOAK_CLIENT_ID: jupiter-web
        run: |
          if [[ -z "$VITE_API_BASE_URL" || -z "$VITE_KEYCLOAK_URL" ]]; then
            echo 'Set JUPITER_PUBLIC_API_URL and JUPITER_PUBLIC_KEYCLOAK_URL in repository Actions variables.' >&2
            exit 1
          fi
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4